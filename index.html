<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10061b">

<link rel="icon" type="image/png" href="./favicon.png">
<link rel="stylesheet" href="./style.css">

<title>GTA VI Countdown</title>
</head>
<body>
<main class="container">
  <header class="brand">
    <img
      class="rockstar-logo"
      src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Rockstar_Games.svg"
      alt="Rockstar Games logo"
    >
    <div class="rockstar-caption">ROCKSTAR GAMES PRESENTS</div>

    <!-- Official Rockstar artwork with the GTA VI logo already included. -->
    <img
      class="gta-art"
      src="https://www.rockstargames.com/VI/_next/static/media/Jason_Lucia_Rooftop_With_Logos_landscape.04l3xybfa4~6m.jpg?akim=1&imdensity=1&imwidth=3840"
      alt="Official Grand Theft Auto VI artwork with the original game logo"
    >
  </header>

  <div class="subtitle">THE WAIT IS ALMOST OVER</div>

  <section class="countdown" aria-label="Countdown to GTA VI release">
    <div class="time-box"><span id="days">00</span><label>DAYS</label></div>
    <div class="time-box"><span id="hours">00</span><label>HOURS</label></div>
    <div class="time-box"><span id="minutes">00</span><label>MINUTES</label></div>
    <div class="time-box"><span id="seconds">00</span><label>SECONDS</label></div>
  </section>

  <footer class="footer">
    NOVEMBER 19, 2026 · WELCOME TO VICE CITY<br>
    <a href="https://www.rockstargames.com/VI/media/artwork-wallpapers" target="_blank" rel="noopener noreferrer">Official Rockstar GTA VI artwork</a>
    <br>
    <a href="https://www.rockstargames.com/VI" target="_blank" rel="noopener noreferrer">Pre oder here!</a>
  </footer>

  <section class="trailer">
    <h2>OFFICIAL GTA VI TRAILER</h2>
    <div class="trailer-video">
      <iframe
        src="https://www.youtube.com/embed/rz1B4B2yBZY"
        title="GTA VI Official Trailer"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
        loading="lazy">
      </iframe>
    </div>
  </section>
</main>

<script>
const releaseDate = new Date("2026-11-19T00:00:00");
const countdown = document.querySelector(".countdown");

function updateCountdown() {
  const difference = releaseDate.getTime() - Date.now();

  if (difference <= 0) {
    countdown.innerHTML = '<h2 style="font-size:clamp(28px,5vw,48px);text-shadow:0 0 20px #ff36b5">GTA VI IS OUT NOW!</h2>';
    document.querySelector(".subtitle").textContent = "WELCOME TO VICE CITY";
    return;
  }

  const values = {
    days: Math.floor(difference / 86400000),
    hours: Math.floor((difference / 3600000) % 24),
    minutes: Math.floor((difference / 60000) % 60),
    seconds: Math.floor((difference / 1000) % 60)
  };

  for (const [id, value] of Object.entries(values)) {
    document.getElementById(id).textContent = String(value).padStart(2, "0");
  }
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>
</body>
</html>
